---
- name: Install apache2 package
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true

- name: Start and enable apache2
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Allow HTTP through UFW
  ansible.builtin.ufw:
    rule: allow
    port: "80"
    proto: tcp

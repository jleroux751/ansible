---
- name: Create a Directory and Download Tomcat from tomcat.apache.org
  hosts: localhost
  become: true

  tasks:
    - name: Create a Directory /opt/tomcat
      file:
        path: /opt/tomcat
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Download Tomcat using get_url
      get_url:
        url: https://dlcdn.apache.org/tomcat/tomcat-9/v9.0.117/bin/apache-tomcat-9.0.117.tar.gz
        dest: /opt/tomcat/apache-tomcat-9.0.117.tar.gz
        mode: "0644"
        owner: root
        group: root
